name: Schema destructive-diff guard

# Fails the PR if prisma/schema.prisma, applied to the live database,
# would DROP a table/column/enum value or rewrite a column type.
#
# Background — this failure mode has fired three times:
#   2026-08-16  a `db push` from a stale branch would have dropped 13
#               CarouselPost columns incl. 5 populated storyVideoUrl values.
#               Caught manually, before running.
#   2026-08-19  a push from a branch predating RevenueCatEvent DID drop that
#               table. Caught only by noticing it had vanished.
#   2026-08-21  a push FROM MAIN would have dropped Habit, HabitCheck and
#               InsightEvidence. Different cause: no raw SQL at all — schema
#               was pushed from feature branches and main never declared it.
#
# Root cause of the first two: schema.prisma lagged production because a
# column / table / enum was added with raw SQL and never back-declared. The
# third had the same SHAPE (schema behind prod) with a different cause —
# branch pushes. Hence the schedule trigger below. `db push`
# reconciles the DB *to* the schema, so anything the branch doesn't know
# about gets removed.
#
# Unlike rls-check.yml this NEEDS a database connection, so it depends on
# the DIRECT_URL secret. If that secret isn't configured the job reports and
# passes rather than blocking every PR — the local `npm run db:push` guard
# is the hard block; this is defence in depth.

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "scripts/check-destructive-diff.ts"
      - ".github/workflows/schema-destructive-check.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/schema.prisma"
  # Scheduled run against main, path-independent.
  #
  # Added after 2026-08-21, when a `db push` from main would have dropped
  # three tables. That drift was INVISIBLE to every check above: it was not
  # introduced by any PR, and no schema file changed on main. It appeared
  # because schema was pushed to prod FROM FEATURE BRANCHES, so main fell
  # behind production while each branch stayed internally consistent.
  #
  # A trigger that only fires on change cannot see a gap that nothing
  # changed. This one runs regardless, so main-vs-prod divergence surfaces
  # within a day instead of at the next push.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  destructive-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Without this the guard step's `npx` resolves packages from the
      # registry rather than node_modules, pulling Prisma 6 — which requires
      # Node 22 and crashes on this job's Node 20. Installing first makes CI
      # use the repo-pinned Prisma 5.22, exactly like `npm run db:guard`.
      - name: Install dependencies
        run: npm ci

      - name: Check DIRECT_URL secret is configured
        id: secret
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DIRECT_URL secret is not configured — the destructive-diff guard cannot compare against the live database. Add it in repo Settings → Secrets to enable this check."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run destructive-diff guard
        if: steps.secret.outputs.configured == 'true'
        env:
          # Prisma reads both; the diff uses the direct (non-pooled) URL.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/check-destructive-diff.ts --require-db
