<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acuity — Motion Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    html, body {
      margin: 0; padding: 0;
      background: oklch(0.16 0.018 280);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      color: oklch(0.97 0.005 280);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    *, *::before, *::after { box-sizing: border-box; }

    /* Reusable keyframes for the gallery */
    @keyframes mg-shimmer {
      0%   { background-position: -200% 0; opacity: 0; }
      20%  { opacity: 1; }
      100% { background-position: 200% 0; opacity: 0; }
    }
    @keyframes mg-pulse-soft { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes mg-wave {
      0%   { transform: scaleY(0.25); }
      50%  { transform: scaleY(1); }
      100% { transform: scaleY(0.25); }
    }
    @keyframes mg-fade-in-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes mg-bounce-in {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes mg-strike {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes mg-check-spring {
      0% { transform: scale(0); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    @keyframes mg-fab-breathe {
      0%, 100% { box-shadow: 0 0 20px oklch(0.76 0.155 38 / 0.35), 0 8px 18px oklch(0.66 0.155 38 / 0.25); }
      50% { box-shadow: 0 0 30px oklch(0.76 0.155 38 / 0.55), 0 12px 24px oklch(0.66 0.155 38 / 0.35); }
    }

    .grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 32px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="acuity-tokens.jsx"></script>
  <script type="text/babel" src="motion-gallery.jsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
