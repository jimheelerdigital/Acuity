<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acuity — One Minute a Day. A Life of Clarity.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    *, *::before, *::after { box-sizing: border-box; }
    a { text-decoration: none; color: inherit; }
    html { scroll-behavior: smooth; }

    .acuity-scroll { scrollbar-width: none; -ms-overflow-style: none; }
    .acuity-scroll::-webkit-scrollbar { display: none; }

    /* app screen animations (reused by embedded screens) */
    @keyframes acuity-orbit-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes acuity-orbit-rev  { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes acuity-pulse-soft { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes acuity-wave { 0% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } 100% { transform: scaleY(0.25); } }
    @keyframes acuity-shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    /* marketing motion */
    .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s cubic-bezier(.16,.9,.3,1), transform .7s cubic-bezier(.16,.9,.3,1); }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1 !important; transform: none !important; } }

    @keyframes float-chip { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- badge renderer (pure, sets window.renderBadge / window.BADGES) -->
  <script src="badge-system.js"></script>

  <!-- app design system + real screens (reused inside device frames) -->
  <script type="text/babel" src="acuity-tokens.jsx"></script>
  <script type="text/babel" src="acuity-chrome.jsx"></script>
  <script type="text/babel" src="screen-entry.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-thememap.jsx"></script>
  <script type="text/babel" src="screen-lifematrix.jsx"></script>

  <!-- marketing page -->
  <script type="text/babel" src="marketing.jsx"></script>
</body>
</html>
